name: Build macOS (signed + notarize)

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'release-*' ]
  workflow_dispatch: {}

jobs:
  build-mac:
    name: Build, sign and notarize macOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Decode macOS signing cert
        if: secrets.MAC_CERT_P12_BASE64 != ''
        run: |
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > mac_signing_cert.p12

      - name: Import signing identity into keychain
        if: secrets.MAC_CERT_P12_BASE64 != ''
        run: |
          security create-keychain -p github_actions build.keychain
          security import mac_signing_cert.p12 -k ~/Library/Keychains/build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild || true
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p github_actions ~/Library/Keychains/build.keychain

      - name: Build (electron-builder)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg

      - name: Cleanup keychain
        if: secrets.MAC_CERT_P12_BASE64 != ''
        run: |
          security delete-keychain ~/Library/Keychains/build.keychain || true
