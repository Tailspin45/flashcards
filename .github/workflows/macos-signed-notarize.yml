name: Build macOS (signed + notarize)

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'release-*' ]
  workflow_dispatch: {}

jobs:
  build-mac:
    name: Build, sign and notarize macOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Decode macOS signing cert
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "Missing secret: MAC_CERT_P12_BASE64"
            exit 1
          fi
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > mac_signing_cert.p12

      - name: Build (electron-builder)
        env:
          CSC_LINK: mac_signing_cert.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg

      - name: Cleanup keychain
        run: |
          rm -f mac_signing_cert.p12
