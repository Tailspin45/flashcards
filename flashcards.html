<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flashcards</title>
    <style>
      /* Minimal styling retained from original app for readability */
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 18px; }
      h1 { margin-top: 0; }
      .answer-box { display:none; margin-top: 18px; }
      .answer-box.visible { display:block; }
      .grade-row { display:none; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Flashcards</h1>
    <div id="notice" style="display:none;color:#b00;margin-bottom:12px"></div>
    <div>
      <strong id="deckPill">Deck</strong>
      <div><span id="cardCount"></span> • <span id="queueCount"></span></div>
    </div>
    <hr />
    <div>
      <h2 id="question">Question</h2>
      <div class="answer-box" id="answerBox"><strong>Answer:</strong> <div id="answer"></div></div>
      <textarea id="response" rows="3" style="width:100%" placeholder="Your response (optional)"></textarea>
      <div id="gradeRow" class="grade-row">
        <button id="rightBtn">Correct ✓</button>
        <button id="wrongBtn">Wrong ✕</button>
      </div>
      <div style="margin-top:12px">
        <button id="revealBtn">Reveal</button>
        <button id="skipBtn">Skip</button>
        <button id="shuffleBtn">Shuffle</button>
      </div>
    </div>
    <script src="./flashcards.js"></script>
  </body>
</html>
